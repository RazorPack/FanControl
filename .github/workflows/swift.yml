name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make dmg
      - name: Validate app bundle
        run: |
          test -x dist/MacFanControl.app/Contents/MacOS/MacFanControl
          test -x dist/MacFanControl.app/Contents/Helpers/macfancontrol-helper
          plutil -lint dist/MacFanControl.app/Contents/Info.plist
          codesign --verify --deep --strict dist/MacFanControl.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacFanControl.app dist/MacFanControl-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacFanControl-macos-arm64
          path: |
            dist/MacFanControl-macos-arm64.zip
            dist/MacFanControl-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14
