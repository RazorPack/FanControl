name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make
      - name: Validate app bundle
        run: |
          test -x dist/FanControl.app/Contents/MacOS/FanControl
          test -x dist/FanControl.app/Contents/Helpers/fancontrol-helper
          plutil -lint dist/FanControl.app/Contents/Info.plist
          codesign --verify --deep --strict dist/FanControl.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/FanControl.app FanControl-macos-arm64.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" FanControl-macos-arm64.zip --generate-notes
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/')
        with:
          name: FanControl-macos-arm64
          path: FanControl-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14