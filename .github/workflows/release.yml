name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload the build to (leave empty to create a build artifact only)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: make dmg
      - name: Validate app bundle
        run: |
          test -x dist/MacFanControl.app/Contents/MacOS/MacFanControl
          test -x dist/MacFanControl.app/Contents/Helpers/macfancontrol-helper
          plutil -lint dist/MacFanControl.app/Contents/Info.plist
          codesign --verify --deep --strict dist/MacFanControl.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacFanControl.app dist/MacFanControl-macos-arm64.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/MacFanControl-macos-arm64.zip dist/MacFanControl-macos-arm64.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/MacFanControl-macos-arm64.zip dist/MacFanControl-macos-arm64.dmg --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/') && inputs.release_tag == ''
        with:
          name: MacFanControl-macos-arm64
          path: |
            dist/MacFanControl-macos-arm64.zip
            dist/MacFanControl-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14